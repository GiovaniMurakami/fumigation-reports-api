service: fumigation-reports-api
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  environment:
    NODE_ENV: production
    MONGODB_URI: ${env:MONGODB_URI}
    MONGODB_DB_NAME: ${env:MONGODB_DB_NAME, 'galpex'}
    MONGODB_MAX_POOL_SIZE: ${env:MONGODB_MAX_POOL_SIZE, '1'}
    JWT_SECRET: ${env:JWT_SECRET}
    AWS_S3_BUCKET: ${env:AWS_S3_BUCKET}
    AWS_S3_REGION: ${env:AWS_S3_REGION, 'us-east-1'}
    CORS_ORIGIN: ${env:CORS_ORIGIN, '*'}
    PUBLIC_APP_URL: ${env:PUBLIC_APP_URL, 'http://localhost:5173'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [s3:PutObject, s3:GetObject]
          Resource: arn:aws:s3:::${env:AWS_S3_BUCKET}/*

functions:
  api:
    handler: build/handler.handler
    events:
      - httpApi: { path: /{proxy+}, method: ANY }
      - httpApi: { path: /, method: ANY }

package:
  patterns:
    - build/**
    - '!src/**'
    - '!node_modules/**'
